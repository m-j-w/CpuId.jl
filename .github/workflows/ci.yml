name: CI

on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel intermediate builds of pull requests
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64, where `cpuid` is available
          - { version: 'min', os: ubuntu-latest,    arch: x64 }
          - { version: 'lts', os: ubuntu-latest,    arch: x64 }
          - { version: '1',   os: ubuntu-latest,    arch: x64 }
          - { version: '1',   os: windows-latest,   arch: x64 }
          # 32-bit x86
          - { version: '1',   os: ubuntu-latest,    arch: x86 }
          # aarch64, where `cpuid` is not available: CpuId must still
          # precompile and load there, since packages such as CPUSummary.jl
          # depend on it on all platforms, see
          # https://github.com/m-j-w/CpuId.jl/issues/67
          - { version: 'lts', os: macos-latest,     arch: aarch64 }
          - { version: '1',   os: macos-latest,     arch: aarch64 }
          - { version: '1',   os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
